schema: spec-driven

context: |
  Escribe los artefactos en español.
  La fuente de verdad visual es docs/design/el-maestro-design-system.md.
  El acento de interfaz es #FF6A00. No uses amarillo como acento, aunque el código actual lo use.
  No recrees el logo ni inventes precios, existencias, testimonios o datos de contacto.
  La conversión es cotización por WhatsApp, sin checkout ni pagos.
  No implementes la página al redactar una propuesta.

